name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: brew install bats-core shellcheck

      - name: Shellcheck
        run: tests/lint.sh

      - name: Tests
        run: tests/run.sh
