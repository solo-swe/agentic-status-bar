name: CI

on:
  push:
  pull_request:

# The tools come from mise.toml and Xcode from .xcode-version (doc/design/dev-tooling.md).
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned tools
        uses: jdx/mise-action@v5.2.5
        with:
          version: 2026.10.25

      - name: Shellcheck the scripts
        run: tests/lint.sh

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select the pinned Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"

      - name: Swift version
        run: swift --version

      - name: Build and test
        run: tests/swift.sh

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select the pinned Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"

      - name: Install the pinned tools
        uses: jdx/mise-action@v5.2.5
        with:
          version: 2026.10.25

      - name: Build and test the app (unsigned)
        run: tests/app.sh --test
