# Development tools at exact versions, locally and in CI (doc/design/dev-tooling.md).
min_version = "2026.10.25"

[tools]
xcodegen = "2.46.0"
shellcheck = "0.11.0"

[tasks.check]
description = "Every check CI runs: lint, the package tests, their coverage and the app tests"
depends = ["lint", "test --summary", "coverage", "app:test"]
