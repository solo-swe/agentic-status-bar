# XcodeGen spec for the Agentic Status Bar app. Generate the (git-ignored) project with:
#   xcodegen generate --spec App/project.yml
name: AgenticStatusBar
options:
  bundleIdPrefix: com.hakanserce
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AgenticStatusBarCore:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AgenticStatusBar:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: AgenticStatusBarCore
        product: ASBCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Agentic Status Bar
        CFBundleName: Agentic Status Bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakanserce.agentic-status-bar
        PRODUCT_NAME: Agentic Status Bar
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # The build phase below runs `swift build` for asb.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed asb
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          swift build -c release --product asb
          helpers="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helpers"
          cp -f .build/release/asb "$helpers/asb"
