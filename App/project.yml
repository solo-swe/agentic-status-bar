# XcodeGen spec for the Agentic Status Bar app. Generate the (git-ignored) project with:
#   xcodegen generate --spec App/project.yml
name: AgenticStatusBar
options:
  bundleIdPrefix: com.hakanserce
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AgenticStatusBarCore:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AgenticStatusBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AgenticStatusBar
    info:
      path: Generated/Tests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakanserce.agentic-status-bar.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agentic Status Bar.app/Contents/MacOS/Agentic Status Bar"
        BUNDLE_LOADER: "$(TEST_HOST)"

  AgenticStatusBar:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - AgenticStatusBarTests
    sources:
      - path: Sources
      # The app icon, rendered by scripts/make-icon.swift.
      - path: Resources
    dependencies:
      - package: AgenticStatusBarCore
        product: ASBCore
      - package: Sparkle
        product: Sparkle
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Agentic Status Bar
        CFBundleName: Agentic Status Bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Hakan Serce. MIT License."
        # Sparkle: the feed is the appcast attached to the latest published release (scripts/appcast.sh).
        SUFeedURL: https://github.com/hakanserce/agentic-status-bar/releases/latest/download/appcast.xml
        # The EdDSA public key: empty here, so local builds don't update themselves; scripts/package.sh
        # writes SPARKLE_PUBLIC_KEY into release builds (CONTRIBUTING.md › Releases).
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakanserce.agentic-status-bar
        PRODUCT_NAME: Agentic Status Bar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # The build phase below runs `swift build` for asb.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed asb
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          swift build -c release --product asb
          helpers="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helpers"
          cp -f .build/release/asb "$helpers/asb"
